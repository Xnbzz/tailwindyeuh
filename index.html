<!DOCTYPE html>
<html lang="id">
<head>
    <title>Mini Proyek Modul 9</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./dist/output.css">
</head>

<body class="bg-slate-100 font-sans">

    <!-- NAVBAR UTAMA -->
    <!-- 1. flex: membuat logo, menu, dan tombol sejajar ke samping -->
    <!-- 2. justify-between: mendorong logo ke ujung kiri dan tombol ke ujung kanan -->
    <!-- 3. items-center: membuat seluruh elemen sejajar rapi di tengah secara vertikal -->
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm">

        <!-- KELOMPOK KIRI: Logo + Nama Sekolah (Sejajar dengan flex & gap-2.5) -->
        <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center text-white font-extrabold text-lg shadow-sm shadow-blue-500/30">
                R
            </div>

            <div>
                <h1 class="font-bold text-slate-800 leading-tight">RPL</h1>
                <p class="text-[11px] font-medium text-slate-400">SMK ICB CN RPL</p>
            </div>
        </div>

        <!-- KELOMPOK TENGAH: Menu Navigasi (Sejajar dengan flex & gap-6) -->
        <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-slate-600">
            <a href="#" class="text-blue-600 font-semibold">Beranda</a>
            <a href="#" class="hover:text-blue-600 transition">Jadwal Pelajaran</a>
            <a href="#" class="hover:text-blue-600 transition">Tugas PJBL</a>
            <a href="#" class="hover:text-blue-600 transition">E-Rapot</a>
        </nav>

        <!-- KELOMPOK KANAN: Tombol Aksi (Sejajar dengan flex & gap-3) -->
        <div class="flex items-center gap-3">
            <span class="text-xs text-slate-500 font-medium hidden sm:inline">
                Halo, Nabeel
            </span>

            <button class="bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold px-4 py-2 rounded-lg transition shadow-sm">
                Keluar
            </button>
        </div>

    </header>

    <!-- KONTEN DUMMY DI BAWAH NAVBAR -->
    <main class="p-8 max-w-4xl mx-auto text-center">
        <div class="bg-white p-8 rounded-xl border border-slate-200 mt-6">
            <h2 class="text-xl font-bold text-slate-800">
                Selamat Datang di Portal Rekayasa Perangkat Lunak!
            </h2>

            <p class="text-slate-500 mt-2">
                Perhatikan bagaimana komponen Navbar di atas tertata rapi dari ujung kiri hingga kanan berkat kekuatan Flexbox.
            </p>
        </div>
    </main>

</body>
</html>
